services:
  stage-blocking:
    build: .
    image: stage-blocking-tool:latest
    container_name: stage-blocking-tool
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
